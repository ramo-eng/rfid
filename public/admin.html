<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NFC review links</title>
  <script>
    window.APP_BASE = (function () {
      const parts = location.pathname.split("/").filter(Boolean);
      if (location.hostname.endsWith("github.io") && parts[0]) return "/" + parts[0] + "/";
      return "/";
    })();
    function appUrl(path) { return window.APP_BASE + String(path || "").replace(/^\//, ""); }
    document.write('<link rel="stylesheet" href="' + appUrl("styles.css") + '">');
  </script>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <p class="kicker">Shop setup</p>
      <h1>NFC review pages</h1>
      <p>
        Create a page for each shop, then write that URL onto an NFC/RFID tag.
        When a customer taps the tag, their phone opens the page.
      </p>

      <form id="form">
        <label for="name">Shop name</label>
        <input id="name" name="name" required placeholder="Sunset Bistro" />

        <label for="address">Address (optional)</label>
        <input id="address" name="address" placeholder="12 Oak Avenue" />

        <label for="googlePlaceId">Google Place ID</label>
        <input id="googlePlaceId" name="googlePlaceId" required placeholder="ChIJ..." />
        <p class="hint">Find it with Google’s Place ID finder, then paste it here.</p>

        <button class="btn" type="submit">Save shop</button>
      </form>
      <p id="status" class="hint"></p>
    </section>

    <section class="list" id="list"></section>
  </main>
  <script>
    document.write('<script src="' + appUrl("app.js") + '"><\/script>');
    document.write('<script src="' + appUrl("admin.js") + '"><\/script>');
  </script>
</body>
</html>
